name: Build ComfyUI SageAttention2 Image

on:
  workflow_dispatch:
    inputs:
      COMFYUI_REF:
        description: "ComfyUI tag/ref to build"
        required: true
        default: "v0.32.0"
        type: string
      IMAGE_TAG:
        description: "Extra tag suffix (optional)"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: derivatives/pytorch/derivatives/comfyui
          push: true
          build-args: |
            COMFYUI_REF=${{ inputs.COMFYUI_REF }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/bangojir-vastai-comfyui:${{ inputs.COMFYUI_REF }}-sage2-cuda13.2${{ inputs.IMAGE_TAG }}
            ghcr.io/${{ github.repository_owner }}/bangojir-vastai-comfyui:latest
